<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>マーク読み取り55</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1b2a1f">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>

  }

<style>
  :root{
    --paper:#EEF1F4; --paperDeep:#E1E7EC; --card:#FAFBFC; --ink:#1C2226;
    --inkSoft:#63707B; --inkFaint:#9AA6AF; --red:#D8362B; --redSoft:#F6DAD7;
    --green:#2F9E6E; --greenSoft:#D9EFE4; --line:#CBD4DB;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#D8DEE3;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',Meiryo,system-ui,sans-serif;color:var(--ink);}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}
  .header{padding:16px 18px;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:10px;}
  .header .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .header .dot i{width:8px;height:8px;border-radius:50%;background:var(--red);display:block;}
  .header .back{background:none;border:none;color:var(--paper);font-size:20px;cursor:pointer;padding:4px;}
  .header .title{font-weight:700;font-size:16px;letter-spacing:.3px;}
  .body{flex:1;overflow-y:auto;padding:16px 18px 24px;}
  .nav{display:flex;border-top:1px solid var(--line);background:var(--card);}
  .nav button{flex:1;background:none;border:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--inkFaint);font-family:inherit;cursor:pointer;}
  .nav button.active{color:var(--red);}
  .nav button .ic{font-size:19px;}
  .nav button .lb{font-size:10.5px;}
  .nav button.active .lb{font-weight:700;}
  .btn{cursor:pointer;border:none;font-family:inherit;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink);color:var(--paper);border-radius:12px;padding:13px 16px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;}
  .btn-danger{background:var(--red);color:#fff;border-radius:12px;padding:13px 0;font-weight:700;font-size:14px;width:100%;}
  .btn-secondary{background:var(--paperDeep);color:var(--ink);border-radius:10px;padding:12px 0;font-weight:600;font-size:13.5px;}
  .upload-btn{background:var(--ink);color:var(--paper);border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
  .iconbtn{background:none;border:none;padding:4px;color:var(--inkFaint);font-size:16px;cursor:pointer;}
  input[type=text],input[type=number],select,textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit;}
  textarea{font-family:ui-monospace,monospace;resize:vertical;line-height:1.9;letter-spacing:0.2px;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;}
  .stat .v{font-family:ui-monospace,monospace;font-size:20px;font-weight:700;}
  .stat .l{font-size:10.5px;color:var(--inkSoft);margin-top:1px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:20px 16px;text-align:center;color:var(--inkSoft);font-size:12.5px;line-height:1.6;}
  .step-row{display:flex;align-items:center;gap:8px;}
  .badge{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:ui-monospace,monospace;flex-shrink:0;}
  .step-title{font-weight:700;font-size:13.5px;}
  .step-hint{font-size:11px;color:var(--inkSoft);margin:4px 0 0 30px;line-height:1.6;}
  .fieldlabel{font-size:11.5px;font-weight:700;color:var(--inkSoft);margin-bottom:5px;}
  .pill{min-width:38px;height:38px;padding:0 4px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px;font-family:ui-monospace,monospace;cursor:pointer;}
  .pill.small{min-width:30px;height:30px;border-radius:9px;font-size:12px;}
  .pill.active{border-color:var(--red);background:var(--red);color:#fff;}
  .presetbtn{font-size:11px;padding:4px 9px;border-radius:7px;background:#fff;color:var(--inkSoft);border:1px solid var(--line);cursor:pointer;}
  .presetbtn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .modebtn{flex:1;background:var(--card);color:var(--inkSoft);border:1px solid var(--line);border-radius:9px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:700;line-height:1.3;cursor:pointer;}
  .modebtn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .qrow{display:flex;align-items:center;gap:8px;padding:3px 2px;border-radius:6px;}
  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(52px, 1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;max-height:280px;overflow-y:auto;}
  .preview-cell{background:#fff;padding:6px 2px 5px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .preview-cell.missing{background:var(--redSoft);}
  .preview-cell .pc-q{font-size:8.5px;color:var(--inkSoft);font-family:ui-monospace,monospace;}
  .preview-cell .pc-ans{font-size:15px;font-weight:700;font-family:ui-monospace,monospace;color:var(--ink);line-height:1.1;}
  .preview-cell.missing .pc-ans{color:var(--red);}
  .preview-cell.grouped{box-shadow:inset 0 0 0 2px var(--blue, #2E7FD8);}
  .preview-cell.disagree{background:#FFF3D6;box-shadow:inset 0 0 0 2px #C98A00;}
  .preview-cell.disagree .pc-ans{color:#C98A00;}
  .preview-cell.grouped .pc-q{color:#2E7FD8;font-weight:700;}
  .preview-cell .pc-pt{font-size:8px;color:var(--inkFaint);}
  .qlistbox{display:flex;flex-direction:column;gap:0;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);}
  .qrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-bottom:1px solid var(--paperDeep);}
  .qrow:last-child{border-bottom:none;}
  .qrow:nth-child(even){background:rgba(0,0,0,0.015);}
  .qn{width:38px;flex-shrink:0;font-size:11.5px;color:var(--inkSoft);font-family:ui-monospace,monospace;font-weight:700;}
  .result-card{border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;}
  .result-card.ok{background:var(--greenSoft);}
  .result-card.warn{background:var(--redSoft);}
  .result-row{font-size:12.5px;font-weight:700;color:var(--ink);}
  .result-row.sub{font-size:11px;font-weight:600;color:var(--inkSoft);}
  .result-row.warn-text{font-size:11px;font-weight:600;color:var(--red);}
  .subtotal-box{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card);}
  .subtotal-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid var(--paperDeep);}
  .subtotal-row:last-child{border-bottom:none;}
  .flags-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(34px, 1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:220px;overflow-y:auto;}
  .flags-cell{background:#fff;padding:4px 2px 3px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .flags-cell .fc-q{font-size:8px;color:var(--inkFaint);font-family:ui-monospace,monospace;}
  .flags-cell .fc-sym{font-size:13px;font-weight:700;line-height:1;}
  .flags-cell.ok{background:var(--greenSoft);}
  .flags-cell.ok .fc-sym{color:var(--green);}
  .flags-cell.ng{background:var(--redSoft);}
  .flags-cell.ng .fc-sym{color:var(--red);}
  .flags-cell.skip{background:var(--paperDeep);}
  .flags-cell.skip .fc-sym{color:var(--inkFaint);}
  .notice{background:var(--redSoft);color:var(--red);border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700;line-height:1.5;}
  .canvas-wrap{position:relative;width:100%;line-height:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);}
  .canvas-wrap canvas{cursor:crosshair;}
  .offline-banner{background:#FFF6D9;color:#8A6A00;font-size:11px;text-align:center;padding:6px 10px;}
  .notice-blue{background:#E4EEFB;color:#1D5FA8;border-radius:9px;padding:9px 12px;font-size:11.5px;line-height:1.6;}
</style>
</head>

const DB = { sets: [], records: [], drafts: [] };
function normalizeSet(s){
  const points = (Array.isArray(s.points) && s.points.length === TOTAL_Q) ? s.points : Array(TOTAL_Q).fill(0);
  const groups = (s.groups || []).map(g => {
    if (Array.isArray(g)) return { qs: g, points: null }; // old format: plain array of indices
    if (g && Array.isArray(g.qs)) return g; // already new format
    return { qs: [], points: null };
  }).filter(g => g.qs.length >= 2);
  const sections = Array.isArray(s.sections) ? s.sections : [];
  const answerKey = (Array.isArray(s.answerKey) && s.answerKey.length === TOTAL_Q) ? s.answerKey : Array(TOTAL_Q).fill(null);
  return Object.assign({}, s, { points, groups, sections, answerKey });
}
function loadDB(){
  try{ DB.sets = (JSON.parse(localStorage.getItem('msg2_sets') || '[]')).map(normalizeSet); }catch(e){ DB.sets = []; }
  try{ DB.records = JSON.parse(localStorage.getItem('msg2_records') || '[]'); }catch(e){ DB.records = []; }
  try{ DB.drafts = JSON.parse(localStorage.getItem('msg2_drafts') || '[]'); }catch(e){ DB.drafts = []; }
}

function saveDrafts(){ try{ localStorage.setItem('msg2_drafts', JSON.stringify(DB.drafts)); }catch(e){} }
function findDraft(setId, studentName){
  return DB.drafts.find(d => d.setId === setId && d.studentName === studentName) || null;
}
function upsertDraft(setId, studentName, answersArr, lockedSections){
  const existing = findDraft(setId, studentName);
  if (existing) { existing.answers = answersArr.slice(); existing.lockedSections = (lockedSections || []).slice(); existing.updatedAt = Date.now(); }
  else { DB.drafts = [...DB.drafts, { id: uid(), setId, studentName, answers: answersArr.slice(), lockedSections: (lockedSections || []).slice(), updatedAt: Date.now() }]; }
  saveDrafts();
}

// 検出結果を既存の答えにマージする（続き採点用）。新しい読み取りで判定できた
// 問題はその値を採用し、判定できなかった（null）問題は前回までの値を残す。
// これにより「1回目は途中まで解いて採点→2回目で続きを採点」を、点数の
// 足し算ではなく完全な答えの再採点として自然に扱える（順不同グループが
// 2回に分かれても正しく採点できる）。
function mergeDetectedAnswers(current, incoming){
  const base = (current && current.length === TOTAL_Q) ? current : Array(TOTAL_Q).fill(null);
  return incoming.map((v, i) => (v !== null && v !== undefined) ? v : base[i]);
}

// ---- robust answer-text parsing ----
const CIRCLED_MAP = { '⓪':'0','①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9' };
function parseAnswerText(text, baseAnswerKey, basePoints){
  const pairs = new Map();  // question number (1-indexed) -> raw answer char
  const pts = new Map();    // question number -> points (only when explicitly given)
  let workText = text || '';

  // triple format first: "問1:4:2" / "1:4:2" (answer + points), so the plain pair
  // regexes below don't also partially match the same substring.
  const reTriple = /(?:問)?\s*(\d{1,3})\s*[:：]\s*([⓪①②③④⑤⑥⑦⑧⑨0-9a-zA-Z])\s*[:：]\s*(\d{1,3})/g;
  let m;
  while ((m = reTriple.exec(workText)) !== null) {
    const qn = parseInt(m[1], 10);
    pairs.set(qn, m[2]);
    pts.set(qn, parseInt(m[3], 10));
  }
  workText = workText.replace(reTriple, ' ');

  const reCircled = /(?:問)?\s*(\d{1,3})\s*[番号]?\s*([⓪①②③④⑤⑥⑦⑧⑨])/g;
  const reColon = /(?:問)?\s*(\d{1,3})\s*[:：]\s*([0-9a-zA-Z])/g;
  while ((m = reCircled.exec(workText)) !== null) { const qn = parseInt(m[1], 10); if (!pairs.has(qn)) pairs.set(qn, m[2]); }
  while ((m = reColon.exec(workText)) !== null) { const qn = parseInt(m[1], 10); if (!pairs.has(qn)) pairs.set(qn, m[2]); }

  const next = baseAnswerKey.slice();
  const nextPoints = (basePoints || Array(TOTAL_Q).fill(0)).slice();
  const unresolved = [];
  let count = 0;

  if (pairs.size > 0) {
    pairs.forEach((rawCh, qn) => {
      count++;
      const ch = CIRCLED_MAP[rawCh] || rawCh;
      const idx = CHOICE_LABELS.findIndex(l => l.toLowerCase() === String(ch).toLowerCase());
      if (qn >= 1 && qn <= TOTAL_Q && idx >= 0) {
        next[qn - 1] = idx;
        if (pts.has(qn)) nextPoints[qn - 1] = pts.get(qn);
      } else unresolved.push(qn);
    });
    return { next, points: nextPoints, unresolved, count, pointsFound: pts.size, pointsSet: new Set(pts.keys()), mode: 'labeled' };
  }

  // fallback: plain sequential list, fills from question 1 onward
  const tokens = text.split(/[,、\s\n]+/).map(t => t.trim()).filter(Boolean);
  const seqNext = Array(TOTAL_Q).fill(null);
  const seqUnresolved = [];
  tokens.slice(0, TOTAL_Q).forEach((tok, i) => {
    const ch = CIRCLED_MAP[tok] || tok;
    const idx = CHOICE_LABELS.findIndex(l => l.toLowerCase() === ch.toLowerCase());
    if (idx >= 0) seqNext[i] = idx; else seqUnresolved.push(i + 1);
  });
  return { next: seqNext, points: (basePoints || Array(TOTAL_Q).fill(0)).slice(), unresolved: seqUnresolved, count: tokens.length, pointsFound: 0, pointsSet: new Set(), mode: 'sequential' };
}

// ---- まとめて採点するグループ（任意で合計配点も指定できる: "27-28:3"） ----
// 2種類ある：
//   ・順不同グループ（デフォルト。既存データとの後方互換のため無印＝これ）：
//     グループ内の正解を「集合」として比較する。どの解答欄にどの正解が入っていても、
//     全部の正解が過不足なく揃っていれば満点（位置の入れ替えOK）。
//     例：「30-31」→ 解答表で正解が②-①のようにハイフンでつながっている＝順序を問わない。
//   ・順序通りグループ（範囲の直後に「順」を付ける。例："9-12順:3"）：
//     グループ内の各解答欄はそれぞれ決まった正解を持ち、その位置のまま全部一致して
//     初めて満点（全部正解のみ加点＝all-or-nothingだが、位置の入れ替えは不可）。
//     例：「9-12」を解答表の※（全部正解の場合のみ点を与える）注釈と一緒に見た場合。
function parseGroupsText(text){
  const groups = [];
  (text || '').split(/[,、\n]+/).map(s => s.trim()).filter(Boolean).forEach(tok => {
    const m = tok.match(/^(\d+)\s*[-〜~－]\s*(\d+)\s*(順|order)?\s*(?:[:：]\s*(\d+))?$/);
    if (!m) return;
    let a = parseInt(m[1], 10) - 1, b = parseInt(m[2], 10) - 1;
    if (a > b) { const t = a; a = b; b = t; }
    if (a < 0 || b >= TOTAL_Q) return;
    const qs = [];
    for (let i = a; i <= b; i++) qs.push(i);
    if (qs.length >= 2) groups.push({ qs, points: m[4] ? parseInt(m[4], 10) : null, order: !!m[3] });
  });
  return groups;
}
function groupsToText(groups){
  return (groups || []).map(g => `${g.qs[0] + 1}-${g.qs[g.qs.length - 1] + 1}${g.order ? '順' : ''}` + (g.points != null ? `:${g.points}` : '')).join(', ');
}
const serializeGroups = groupsToText;
function groupIndexOfQuestion(groups, qi){
  for (let gi = 0; gi < (groups || []).length; gi++) if (groups[gi].qs.indexOf(qi) !== -1) return gi;
  return -1;
}

// ---- 配点（1問ごとの点数。省略時は全問1点） ----
function parsePointsText(text, count){
  const arr = Array(count).fill(0);
  const tokens = (text || '').split(/[,、\s\n]+/).map(t => t.trim()).filter(Boolean);
  tokens.slice(0, count).forEach((tok, i) => {
    const n = parseInt(tok, 10);
    if (!isNaN(n) && n >= 0) arr[i] = n;
  });
  return arr;
}
function pointsToText(points){ return (points || []).join(','); }
function compressToRanges(nums){
  if (!nums || nums.length === 0) return '';
  const sorted = nums.slice().sort((a, b) => a - b);
  const parts = [];
  let start = sorted[0], prev = sorted[0];
  for (let i = 1; i <= sorted.length; i++) {
    const cur = sorted[i];
    if (cur === prev + 1) { prev = cur; continue; }
    parts.push(start === prev ? `${start}` : `${start}〜${prev}`);
    if (i < sorted.length) { start = cur; prev = cur; }
  }
  return parts.join(', ');
}
function groupPoints(g, points){ return g.points != null ? g.points : g.qs.reduce((s, qi) => s + (points[qi] || 0), 0); }

// 大問（セクション）ごとの配点を、正解の登録有無に関係なく「配点＋グループ設定」だけから
// 自動計算する（セット登録画面用）。グループが大問をまたぐ場合は、そのグループの
// 最初の問題が属する大問にまとめて計上する。
function computeSectionPointTotals(sections, groups, points){
  const groupedIdxSet = new Set();
  (groups || []).forEach(g => g.qs.forEach(qi => groupedIdxSet.add(qi)));
  const groupOwnerSection = (groups || []).map(g => sections.findIndex(sec => sec.qs.includes(g.qs[0])));
  const perSection = sections.map((sec, si) => {
    let total = sec.qs.reduce((s, qi) => s + (groupedIdxSet.has(qi) ? 0 : (points[qi] || 0)), 0);
    (groups || []).forEach((g, gi) => { if (groupOwnerSection[gi] === si) total += groupPoints(g, points); });
    return { label: sec.label, qs: sec.qs, total };
  });
  const coveredIdx = new Set();
  sections.forEach(sec => sec.qs.forEach(qi => coveredIdx.add(qi)));
  const uncovered = [];
  for (let i = 0; i < points.length; i++) { if (!coveredIdx.has(i)) uncovered.push(i + 1); }
  return { perSection, uncovered };
}

// ---- 大問区切り（採点結果の小計表示用。順不同グループとは別） ----
function parseSectionsText(text){
  const sections = [];
  (text || '').split(/[,、\n]+/).map(s => s.trim()).filter(Boolean).forEach(tok => {
    const m = tok.match(/^(?:(.*?)[:：])?\s*(\d{1,3})\s*[-〜~－]\s*(\d{1,3})$/);
    if (!m) return;
    let a = parseInt(m[2], 10) - 1, b = parseInt(m[3], 10) - 1;
    if (a > b) { const t = a; a = b; b = t; }
    if (a < 0 || b >= TOTAL_Q) return;
    const qs = [];
    for (let i = a; i <= b; i++) qs.push(i);
    sections.push({ label: m[1] ? m[1].trim() : `大問${sections.length + 1}`, qs });
  });
  return sections;
}
function sectionsToText(sections){
  return (sections || []).map(s => `${s.label}:${s.qs[0] + 1}-${s.qs[s.qs.length - 1] + 1}`).join(', ');
}
// per-question earned/possible points, with grouped questions' full point value
// attributed to the first member only (so summing over any range is correct).
function computeEarnedPossible(set, answers){
  const groups = set.groups || [];
  const points = set.points || Array(TOTAL_Q).fill(0);
  const inGroup = new Array(TOTAL_Q).fill(-1);
  groups.forEach((g, gi) => g.qs.forEach(qi => { inGroup[qi] = gi; }));
  const earned = new Array(TOTAL_Q).fill(0);
  const possible = new Array(TOTAL_Q).fill(0);
  const handled = new Set();
  for (let i = 0; i < TOTAL_Q; i++) {
    const gi = inGroup[i];
    if (gi !== -1) {
      if (handled.has(gi)) continue;
      handled.add(gi);
      const g = groups[gi];
      if (g.qs.some(qi => set.answerKey[qi] === null)) continue;
      const gp = groupPoints(g, points);
      const allMarked = g.qs.every(qi => answers[qi] !== null && answers[qi] !== undefined);
      const match = allMarked && (g.order
        ? g.qs.every(qi => answers[qi] === set.answerKey[qi])
        : JSON.stringify(g.qs.map(qi => set.answerKey[qi]).slice().sort()) === JSON.stringify(g.qs.map(qi => answers[qi]).slice().sort()));
      possible[g.qs[0]] = gp;
      earned[g.qs[0]] = match ? gp : 0;
    } else {
      if (set.answerKey[i] === null) continue;
      possible[i] = points[i];
      earned[i] = (answers[i] !== null && answers[i] !== undefined && answers[i] === set.answerKey[i]) ? points[i] : 0;
    }
  }
  return { earned, possible };
}
function computeSectionSubtotals(set, answers){
  const sections = set.sections || [];
  if (!sections.length) return [];
  const { earned, possible } = computeEarnedPossible(set, answers);
  return sections.map(sec => ({
    label: sec.label,
    score: sec.qs.reduce((s, qi) => s + earned[qi], 0),
    total: sec.qs.reduce((s, qi) => s + possible[qi], 0),
  }));
}

function scoreSet(set, answers){
  const groups = set.groups || [];
  const points = set.points || Array(TOTAL_Q).fill(0);
  const inGroup = new Array(TOTAL_Q).fill(-1);
  groups.forEach((g, gi) => g.qs.forEach(qi => { inGroup[qi] = gi; }));
  const flags = new Array(TOTAL_Q).fill('skip');
  let score = 0, total = 0;
  const handled = new Set();
  for (let i = 0; i < TOTAL_Q; i++) {
    const gi = inGroup[i];
    if (gi !== -1) {
      if (handled.has(gi)) continue;
      handled.add(gi);
      const g = groups[gi];
      const gp = groupPoints(g, points);
      if (g.qs.some(qi => set.answerKey[qi] === null)) { g.qs.forEach(qi => { flags[qi] = 'skip'; }); continue; }
      total += gp;
      const allMarked = g.qs.every(qi => answers[qi] !== null && answers[qi] !== undefined);
      const match = allMarked && (g.order
        ? g.qs.every(qi => answers[qi] === set.answerKey[qi])
        : JSON.stringify(g.qs.map(qi => set.answerKey[qi]).slice().sort()) === JSON.stringify(g.qs.map(qi => answers[qi]).slice().sort()));
      if (match) score += gp;
      g.qs.forEach(qi => { flags[qi] = match ? 'ok' : 'ng'; });
    } else {
      if (set.answerKey[i] === null) { flags[i] = 'skip'; continue; }
      total += points[i];
      const ok = answers[i] !== null && answers[i] !== undefined && answers[i] === set.answerKey[i];
      if (ok) score += points[i];
      flags[i] = ok ? 'ok' : 'ng';
    }
  }
  return { score, total, flags };
}

// ---- multi-vote merge (used for double/triple AI cross-checking) ----
// voteArrays: array of Array(totalQ) where each entry is a choice-index or null.
// A question is accepted only if the most common non-null value reaches a
// majority of the voters (2/2 for double, 2/3 for triple). Anything short of
// that is left blank and reported back so the person can check it by hand.
function mergeVotes(voteArrays, totalQ){
  const n = voteArrays.length;
  const threshold = Math.floor(n / 2) + 1;
  const merged = Array(totalQ).fill(null);
  const disagreements = [];
  for (let i = 0; i < totalQ; i++) {
    const vals = voteArrays.map(v => v[i]).filter(v => v !== null && v !== undefined);
    if (vals.length === 0) continue;
    const counts = {};
    vals.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
    let bestVal = null, bestCount = 0;
    Object.keys(counts).forEach(k => { if (counts[k] > bestCount) { bestCount = counts[k]; bestVal = Number(k); } });
    if (bestCount >= threshold) merged[i] = bestVal;
    else disagreements.push(i + 1);
  }
  return { merged, disagreements };
}

// ---- homography (4-point perspective transform) ----
function solveLinear(A, b){
  const n = b.length;
  const M = A.map((row, i) => row.concat([b[i]]));
  for (let col = 0; col < n; col++) {
    let maxRow = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[maxRow][col])) maxRow = r;
    const tmp = M[col]; M[col] = M[maxRow]; M[maxRow] = tmp;
    const pivot = M[col][col];
    for (let c = col; c <= n; c++) M[col][c] /= pivot;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const factor = M[r][col];
      for (let c = col; c <= n; c++) M[r][c] -= factor * M[col][c];
    }
  }
  return M.map(row => row[n]);
}
function computeHomography(src, dst){
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [X, Y] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -x * X, -y * X]); b.push(X);
    A.push([0, 0, 0, x, y, 1, -x * Y, -y * Y]); b.push(Y);
  }
  const h = solveLinear(A, b);
  return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
}
function applyHomography(H, x, y){
  const denom = H[6] * x + H[7] * y + 1;
  return [(H[0] * x + H[1] * y + H[2]) / denom, (H[3] * x + H[4] * y + H[5]) / denom];
}

// ---- tiny DOM helper ----
function el(tag, attrs, children){
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs){
    const v = attrs[k];
    if (v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.indexOf('on') === 0 && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  (children == null ? [] : Array.isArray(children) ? children : [children]).forEach(c => {
    if (c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

// CORNER-CALIBRATED PHOTO READER (shared: registration & grading)
// ============================================================
// photoState: { img, w, h, corners:[{x,y}...], loadError:'' }
function mapBubblesToPixels(corners){
  const src = GEOMETRY.frame;                       // 4 known template-space corners (TL,TR,BR,BL)
  const dst = corners.map(p => [p.x, p.y]);          // 4 tapped pixel points, same order
  const H = computeHomography(src, dst);
  return GEOMETRY.bubbles.map(row => row.map(([fx, fy]) => {
    const [px, py] = applyHomography(H, fx, fy);
    return { x: px, y: py };
  }));
}
function detectFromPixels(img, w, h, pixelGrid){
  const tmp = document.createElement('canvas'); tmp.width = w; tmp.height = h;
  const ctx = tmp.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  function sample(x, y){
    const size = 9, half = 4;
    const sx = Math.max(0, Math.min(w - size, Math.round(x - half)));
    const sy = Math.max(0, Math.min(h - size, Math.round(y - half)));
    const data = ctx.getImageData(sx, sy, size, size).data;
    let sum = 0, n = 0;
    for (let i = 0; i < data.length; i += 4) { sum += data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114; n++; }
    return sum / n;
  }
  return pixelGrid.map(row => {
    const vals = row.map(p => sample(p.x, p.y));
    let minI = 0; for (let i = 1; i < vals.length; i++) if (vals[i] < vals[minI]) minI = i;
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    return (avg - vals[minI] > 28) ? minI : null;
  });
}

// ---- タップ位置の拡大ルーペ（スマホでの4隅タップ精度対策） ----
// 指で押している間、押している場所を指の少し上に拡大表示し、指を離した瞬間の
// 位置を確定タップ座標として扱う（指自体でマークが隠れてしまう問題を回避する）。
// マウス操作（PC）では表示しない（すでに精密にタップできるため不要）。
let _magnifierEl = null;
function getMagnifier(){
  if (_magnifierEl) return _magnifierEl;
  const size = 132;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const canvas = document.createElement('canvas');
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.cssText = `position:fixed;width:${size}px;height:${size}px;border-radius:50%;border:3px solid #2E7FD8;box-shadow:0 4px 16px rgba(0,0,0,0.35);pointer-events:none;z-index:9999;display:none;background:#fff;`;
  document.body.appendChild(canvas);
  _magnifierEl = canvas;
  return canvas;
}
function showMagnifier(sourceCanvas, imgX, imgY, dispW, dispH, clientX, clientY){
  const mag = getMagnifier();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = mag.width / dpr; // CSS表示サイズ（px）
  const ctx = mag.getContext('2d');
  ctx.save();
  ctx.clearRect(0, 0, mag.width, mag.height);
  ctx.beginPath(); ctx.arc(mag.width / 2, mag.height / 2, mag.width / 2, 0, Math.PI * 2); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, mag.width, mag.height);
  const half = Math.max(10, dispW * 0.018); // 元画像から切り出す範囲（狭いほど高倍率）
  const sx = Math.max(0, Math.min(dispW - half * 2, imgX - half));
  const sy = Math.max(0, Math.min(dispH - half * 2, imgY - half));
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(sourceCanvas, sx, sy, half * 2, half * 2, 0, 0, mag.width, mag.height);
  ctx.restore();
  // 中心の十字線＝実際にタップが確定する座標
  const cx = mag.width / 2, cy = mag.height / 2, r = 9 * dpr;
  ctx.strokeStyle = 'rgba(216,54,43,0.9)'; ctx.lineWidth = 1.6 * dpr;
  ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  // 指に隠れないよう、押している場所の少し上に表示（画面上端付近なら下に出す）
  let left = clientX - size / 2;
  let top = clientY - size - 44;
  left = Math.max(6, Math.min(window.innerWidth - size - 6, left));
  if (top < 6) top = clientY + 44;
  mag.style.left = left + 'px'; mag.style.top = top + 'px'; mag.style.display = 'block';
}
function hideMagnifier(){ if (_magnifierEl) _magnifierEl.style.display = 'none'; }

// タップした点の近くを軽く探索し、実際の黒い照準マーク（塗りつぶし四角）の重心に
// 自動で吸着させる。単純な重心ではなく「タップ点に一番近い、閾値以下の連結した
// 黒い塊（Connected Component）」を探す方式にすることで、写真の背景（机の木目や
// 影など）がたまたま窓内に写り込んでも、そちらに重心を引っ張られにくくしている。
// 塊が大きすぎる（机など）・小さすぎる（ノイズ）場合や、見つからない場合は
// 元のタップ位置にそのままフォールバックする。
function snapToNearestMarker(img, w, h, x, y){
  const win = Math.max(10, Math.round(w * 0.028)); // 探索半径（写真幅の約2.8%・前回の5%より縮小）
  const sx = Math.max(0, Math.round(x - win));
  const sy = Math.max(0, Math.round(y - win));
  const ex = Math.min(w, Math.round(x + win));
  const ey = Math.min(h, Math.round(y + win));
  const ww = ex - sx, hh = ey - sy;
  if (ww <= 2 || hh <= 2) return { x, y };
  const tmp = document.createElement('canvas'); tmp.width = ww; tmp.height = hh;
  const ctx = tmp.getContext('2d');
  ctx.drawImage(img, sx, sy, ww, hh, 0, 0, ww, hh);
  const data = ctx.getImageData(0, 0, ww, hh).data;
  const n = ww * hh;
  const lum = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const idx = i * 4;
    lum[i] = data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114;
  }
  // 絶対的なしきい値（印字の黒マーカーを想定・机の影程度の暗さでは超えないよう厳しめ）
  const threshold = 95;
  const isDark = i => lum[i] < threshold;

  // タップ点に最も近い「暗い画素」をシード（探索の起点）にする
  const cx = Math.round(x - sx), cy = Math.round(y - sy);
  let seed = -1, seedDist = Infinity;
  for (let py = 0; py < hh; py++) {
    for (let px = 0; px < ww; px++) {
      const i = py * ww + px;
      if (isDark(i)) {
        const d = (px - cx) * (px - cx) + (py - cy) * (py - cy);
        if (d < seedDist) { seedDist = d; seed = i; }
      }
    }
  }
  if (seed === -1) return { x, y }; // 暗い画素が見つからない → タップ位置のまま

  // シードから幅優先探索（BFS）で連結した暗い塊だけを取り出す
  const visited = new Uint8Array(n);
  const queue = [seed]; visited[seed] = 1;
  let qi = 0, sumX = 0, sumY = 0, count = 0;
  while (qi < queue.length) {
    const i = queue[qi++];
    const px = i % ww, py = (i / ww) | 0;
    sumX += px; sumY += py; count++;
    if (px > 0) { const ni = i - 1; if (!visited[ni] && isDark(ni)) { visited[ni] = 1; queue.push(ni); } }
    if (px < ww - 1) { const ni = i + 1; if (!visited[ni] && isDark(ni)) { visited[ni] = 1; queue.push(ni); } }
    if (py > 0) { const ni = i - ww; if (!visited[ni] && isDark(ni)) { visited[ni] = 1; queue.push(ni); } }
    if (py < hh - 1) { const ni = i + ww; if (!visited[ni] && isDark(ni)) { visited[ni] = 1; queue.push(ni); } }
  }
  const maxBlob = n * 0.4;  // 大きすぎる塊（机・大きな影など）は却下
  const minBlob = 4;        // 小さすぎる（ノイズ）ものも却下
  if (count < minBlob || count > maxBlob) return { x, y };
  return { x: sx + sumX / count, y: sy + sumY / count };
}

function renderCornerPhotoReader(cfg){
  const { answers, setAnswers, groups, photoState, dotColor } = cfg;
  const mergeAnswers = cfg.mergeAnswers || setAnswers; // 継続採点を使わない画面（正解登録）は overwrite と同じ
  const onCalibrated = cfg.onCalibrated || null; // タップ確定時にファイル＋タップ判定結果を通知（AI照合との組み合わせ用）
  const highlightQs = cfg.highlightQs || null; // 大問を選んでいる時、その大問の問題だけ赤丸を表示する（nullなら全問表示）
  const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } });

  function handlePhotoFile(file){
    photoState.loadError = '';
    if (!file.type || file.type.indexOf('image/') !== 0) { photoState.loadError = '画像ファイルを選んでください。'; render(); return; }
    const reader = new FileReader();
    reader.onerror = () => { photoState.loadError = 'ファイルを読み込めませんでした。もう一度お試しください。'; render(); };
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => { photoState.loadError = '画像として開けませんでした。別の写真でお試しください。'; render(); };
      img.onload = () => {
        const maxDim = 1800;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (Math.max(w, h) > maxDim) { const s = maxDim / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
        photoState.img = img; photoState.w = w; photoState.h = h; photoState.file = file;
        photoState.corners = [];
        // 直前までの採点結果（続き採点で積み上げた分・他の大問の分）を消さないよう、
        // ここでは answers を触らずに再描画だけする。実際の反映は4隅タップ完了後の
        // mergeAnswers(検出結果) で行われる。
        render();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  if (!photoState.img) {
    const label = el('label', { class: 'btn upload-btn' });
    label.appendChild(el('div', { style: { fontSize: '20px' } }, '📷'));
    label.appendChild(el('span', { style: { fontWeight: '700', fontSize: '13px' } }, 'タップして写真・スクショを選ぶ'));
    const inp = el('input', { type: 'file', accept: 'image/*', style: { display: 'none' } });
    inp.addEventListener('change', e => { if (e.target.files[0]) handlePhotoFile(e.target.files[0]); });
    label.appendChild(inp);
    wrap.appendChild(label);
    if (photoState.loadError) wrap.appendChild(el('div', { style: { fontSize: '11.5px', color: 'var(--red)', textAlign: 'center' } }, photoState.loadError));
    return wrap;
  }

  const calibDone = photoState.corners.length >= 4;

  if (!calibDone) {
    const box = el('div', { class: 'notice' });
    box.appendChild(document.createTextNode(`用紙の${CORNER_LABELS[photoState.corners.length]}の中心をタップ`));
    box.appendChild(el('div', { style: { fontWeight: '400', marginTop: '2px', fontSize: '11px' } }, `あと${4 - photoState.corners.length}回タップすると全55問を自動で読み取ります。指を押したまま拡大表示で位置を微調整し、離した瞬間に確定します。`));
    wrap.appendChild(box);
    const ctrlRow = el('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px', flexWrap: 'wrap' } });
    const snapLabel = el('label', { style: { display: 'flex', alignItems: 'center', gap: '5px', fontSize: '10.5px', color: 'var(--inkSoft)', cursor: 'pointer' } });
    const snapCheckbox = el('input', { type: 'checkbox' });
    if (photoState.snapEnabled === undefined) photoState.snapEnabled = false;
    snapCheckbox.checked = photoState.snapEnabled;
    snapCheckbox.addEventListener('change', e => { photoState.snapEnabled = e.target.checked; render(); });
    snapLabel.appendChild(snapCheckbox);
    snapLabel.appendChild(document.createTextNode('タップ位置を近くの黒マークへ自動補正する（うまく合わない時はオフに）'));
    ctrlRow.appendChild(snapLabel);
    if (photoState.corners.length > 0) {
      ctrlRow.appendChild(el('button', { class: 'btn btn-secondary', style: { fontSize: '11px', padding: '4px 10px' }, onclick: () => { photoState.corners.pop(); render(); } }, '↩ 1つ前のタップを取り消す'));
    }
    wrap.appendChild(ctrlRow);
  } else {
    wrap.appendChild(el('div', { style: { fontSize: '11.5px', color: 'var(--inkSoft)' } }, '読み取り結果です。下の一覧で問題ごとに確認・訂正できます。'));
  }

  const dispW = photoState.w, dispH = photoState.h;
  const canvasEl = document.createElement('canvas');
  canvasEl.width = dispW; canvasEl.height = dispH;
  canvasEl.style.width = '100%'; canvasEl.style.height = 'auto'; canvasEl.style.display = 'block';
  const ctx = canvasEl.getContext('2d');
  ctx.drawImage(photoState.img, 0, 0, dispW, dispH);

  ctx.strokeStyle = '#2E7FD8';
  ctx.lineWidth = Math.max(2.4, dispW * 0.008);
  photoState.corners.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, dispW * 0.042, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(p.x, p.y, dispW * 0.007, 0, Math.PI * 2); ctx.fillStyle = '#2E7FD8'; ctx.fill();
    ctx.font = 'bold ' + Math.round(dispW * 0.036) + 'px sans-serif';
    ctx.fillStyle = '#2E7FD8';
    ctx.fillText(String(i + 1), p.x + dispW * 0.048, p.y - dispW * 0.024);
  });

  let pixelGrid = null;
  if (calibDone) {
    pixelGrid = mapBubblesToPixels(photoState.corners);
    pixelGrid.forEach((row, qi) => {
      const inScope = !highlightQs || highlightQs.has(qi);
      row.forEach((p, ci) => {
        const marked = inScope && answers[qi] === ci;
        ctx.beginPath();
        ctx.arc(p.x, p.y, dispW * 0.017, 0, Math.PI * 2);
        if (marked) { ctx.fillStyle = dotColor; ctx.globalAlpha = 0.85; ctx.fill(); ctx.globalAlpha = 1; }
        else { ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = Math.max(0.6, dispW * 0.0016); ctx.stroke(); }
      });
    });
  }

  const canvasWrap = el('div', { class: 'canvas-wrap' });
  canvasWrap.appendChild(canvasEl);
  canvasEl.style.touchAction = 'none'; // タップ中にブラウザ側でスクロール／ピンチが割り込まないようにする

  function commitTapAt(x, y){
    if (photoState.corners.length < 4) {
      const snapped = photoState.snapEnabled === false ? { x, y } : snapToNearestMarker(photoState.img, dispW, dispH, x, y);
      photoState.corners.push(snapped);
      if (photoState.corners.length === 4) {
        const grid = mapBubblesToPixels(photoState.corners);
        const detected = detectFromPixels(photoState.img, dispW, dispH, grid);
        mergeAnswers(detected);
        if (onCalibrated) onCalibrated(photoState.file, detected);
      } else {
        render();
      }
      return;
    }
    if (!pixelGrid) return;
    const radius = dispW * 0.028;
    let best = null, bestD = Infinity;
    pixelGrid.forEach((row, qi) => row.forEach((p, ci) => { const d = Math.hypot(p.x - x, p.y - y); if (d < bestD) { bestD = d; best = { qi, ci }; } }));
    if (best && bestD <= radius) {
      const next = answers.slice(); next[best.qi] = next[best.qi] === best.ci ? null : best.ci;
      setAnswers(next);
    }
  }
  function clientToImageXY(evt){
    const rect = canvasEl.getBoundingClientRect();
    const x = (evt.clientX - rect.left) * (dispW / rect.width);
    const y = (evt.clientY - rect.top) * (dispH / rect.height);
    return { x: Math.max(0, Math.min(dispW, x)), y: Math.max(0, Math.min(dispH, y)) };
  }
  let dragging = false;
  canvasEl.addEventListener('pointerdown', evt => {
    evt.preventDefault();
    try { canvasEl.setPointerCapture(evt.pointerId); } catch (e) {}
    dragging = true;
    const { x, y } = clientToImageXY(evt);
    if (evt.pointerType === 'touch' || evt.pointerType === 'pen') showMagnifier(canvasEl, x, y, dispW, dispH, evt.clientX, evt.clientY);
  });
  canvasEl.addEventListener('pointermove', evt => {
    if (!dragging) return;
    evt.preventDefault();
    const { x, y } = clientToImageXY(evt);
    if (evt.pointerType === 'touch' || evt.pointerType === 'pen') showMagnifier(canvasEl, x, y, dispW, dispH, evt.clientX, evt.clientY);
  });
  canvasEl.addEventListener('pointerup', evt => {
    if (!dragging) return;
    dragging = false;
    hideMagnifier();
    const { x, y } = clientToImageXY(evt);
    commitTapAt(x, y);
  });
  canvasEl.addEventListener('pointercancel', () => { dragging = false; hideMagnifier(); });
  wrap.appendChild(canvasWrap);

  if (!calibDone && photoState.corners.length > 0) {
    // 4隅タップ中、写真の途中までスクロールしていても手が届くよう、
    // 上部の操作列とは別に写真の中段にも「戻る」ボタンを重ねて表示する。
    const midUndo = el('button', {
      class: 'btn btn-secondary',
      style: {
        position: 'absolute', right: '10px', top: '50%', transform: 'translateY(-50%)',
        zIndex: '5', padding: '10px 14px', fontSize: '11.5px', fontWeight: '700',
        boxShadow: '0 2px 10px rgba(0,0,0,0.3)', opacity: '0.94',
      },
      onclick: e => { e.stopPropagation(); photoState.corners.pop(); render(); },
    }, '↩ 1つ前に戻る');
    canvasWrap.appendChild(midUndo);
  }

  const btnRow = el('div', { style: { display: 'flex', gap: '8px' } });
  btnRow.appendChild(el('button', { class: 'btn btn-secondary', style: { flex: '1' }, onclick: () => { photoState.corners = []; render(); if (cfg.onReset) cfg.onReset(); } }, '⟲ 位置をやり直す'));
  const retakeLabel = el('label', { class: 'btn btn-secondary', style: { flex: '1', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '6px', cursor: 'pointer' } }, '📷 撮り直す');
  const retakeInp = el('input', { type: 'file', accept: 'image/*', style: { display: 'none' } });
  retakeInp.addEventListener('change', e => { if (e.target.files[0]) { handlePhotoFile(e.target.files[0]); if (cfg.onReset) cfg.onReset(); } });
  retakeLabel.appendChild(retakeInp);
  btnRow.appendChild(retakeLabel);
  wrap.appendChild(btnRow);

  if (calibDone) {
    wrap.appendChild(renderAnswerCorrectionList(answers, setAnswers, groups, highlightQs));
  }

  return wrap;
}

function renderAnswerCorrectionList(answers, setAnswers, groups, filterQs){
  const qIndices = filterQs ? Array.from(filterQs).sort((a, b) => a - b) : Array.from({ length: TOTAL_Q }, (_, i) => i);
  const missing = qIndices.filter(qi => answers[qi] === null).length;
  const listWrap = el('div');
  const filterNote = filterQs ? `（選択中の大問のみ表示・${qIndices.length}問）` : '';
  listWrap.appendChild(el('div', { style: { fontSize: '11.5px', fontWeight: '700', color: 'var(--inkSoft)' } }, `読み取り結果（タップで訂正）${filterNote} ・ 未検出 ${missing}問`));
  const listBox = el('div', { class: 'qlistbox' });
  qIndices.forEach(qi => {
    const row = el('div', { class: 'qrow', style: { background: answers[qi] === null ? 'var(--redSoft)' : 'transparent' } });
    const gi = groupIndexOfQuestion(groups, qi);
    row.appendChild(el('div', { class: 'qn' }, `Q${qi + 1}` + (gi !== -1 ? '⇄' : '')));
    const pills = el('div', { style: { display: 'flex', gap: '4px', flexWrap: 'wrap' } });
    CHOICE_LABELS.forEach((lab, ci) => {
      pills.appendChild(el('button', { class: 'pill small' + (answers[qi] === ci ? ' active' : ''), onclick: () => {
        const next = answers.slice(); next[qi] = next[qi] === ci ? null : ci; setAnswers(next);
      } }, lab));
    });
    row.appendChild(pills);
    listBox.appendChild(row);
  });
  listWrap.appendChild(listBox);
  return listWrap;
}

// ---- Gemini-based reader for a filled-in (student) mark sheet ----
async function callGeminiRaw(base64, mimeType, apiKey, prompt, models, skipModel){
  let lastErr = null;
  for (const model of models) {
    if (model === skipModel) continue;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
          body: JSON.stringify({ contents: [{ parts: [ { text: prompt }, { inline_data: { mime_type: mimeType, data: base64 } } ] }] }),
        });
        if (!res.ok) {
          const errText = await res.text();
          lastErr = new Error(`APIエラー(${res.status}・${model})：${errText.slice(0, 160)}`);
          if (res.status === 404) break; // model doesn't exist, try next candidate
          if ((res.status === 503 || res.status === 429 || res.status === 500) && attempt === 0) {
            await new Promise(r => setTimeout(r, 900));
            continue; // transient: retry the same model once before moving on
          }
          break; // exhausted retries for this model, try next candidate
        }
        const data = await res.json();
        const text = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
          data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
        if (text) return { text, model };
        break;
      } catch (innerErr) { lastErr = innerErr; break; }
    }
  }
  if (lastErr) throw lastErr;
  return { text: '', model: null };
}

// ---- Claude-based reader (3票目・じまちゃん自身のAnthropic APIキーを使用) ----
async function callClaudeRaw(base64, mimeType, apiKey, prompt, models, skipModel){
  let lastErr = null;
  for (const model of models) {
    if (model === skipModel) continue;
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model,
            max_tokens: 4096,
            messages: [{ role: 'user', content: [
              { type: 'text', text: prompt },
              { type: 'image', source: { type: 'base64', media_type: mimeType, data: base64 } },
            ] }],
          }),
        });
        if (!res.ok) {
          const errText = await res.text();
          lastErr = new Error(`Claude APIエラー(${res.status}・${model})：${errText.slice(0, 160)}`);
          if (res.status === 404) break; // model doesn't exist, try next candidate
          if ((res.status === 529 || res.status === 503 || res.status === 429 || res.status === 500) && attempt === 0) {
            await new Promise(r => setTimeout(r, 900));
            continue;
          }
          break;
        }
        const data = await res.json();
        const textBlock = (data && Array.isArray(data.content)) ? data.content.find(b => b && b.type === 'text') : null;
        const text = textBlock ? textBlock.text : '';
        if (text) return { text, model };
        break;
      } catch (innerErr) { lastErr = innerErr; break; }
    }
  }
  if (lastErr) throw lastErr;
  return { text: '', model: null };
}

const MARK_READ_PROMPT_TMPL = `この画像は、生徒が塗りつぶしたマークシートの写真です。問題は1番から${TOTAL_Q}番まであり、各問題の選択肢は0から9の数字です（横一列に並んだ0〜9の丸から1つを塗りつぶす形式）。各問について、濃く塗りつぶされている選択肢の数字を判定してください。「問題番号:塗られた数字」の形式で、カンマ区切りで、判定できた問題だけ出力してください（例：1:4,2:0,3:7,...）。順番は気にしなくて構いません。塗りつぶしが薄い・複数の選択肢が塗られている・空欄など、自信を持って判定できない問題は出力しないでください。数字とカンマと「:」以外の文字は含めないでください。`;

// vote count（読み取り回数・照合方式）: 'single'=1回のみ, 'double'=Gemini×2, 'triple'=Gemini×2+Claude
function voteCountOf(mode){ return mode === 'single' ? 1 : mode === 'triple' ? 3 : 2; }

// ---- タップ判定＋AI判定の組み合わせ照合（4隅タップは決定論的なので、AIが読み間違えた
// 場合の強力な照合相手になる） ----
async function runComboRead(comboState, setAnswers, geminiKey, claudeKey, aiCount){
  const n = 1 + aiCount; // タップ1票 + AI追加分
  comboState.busy = true; comboState.error = ''; comboState.disagreements = [];
  render();
  try {
    if (!comboState.tapVotes || !comboState.file) throw new Error('先に4隅をタップしてください。');
    const votes = [comboState.tapVotes];
    if (aiCount >= 1) {
      comboState.progress = `Geminiで照合中…（1/${aiCount}）`; render();
      const base64 = await fileToBase64(comboState.file);
      const mimeType = comboState.file.type || 'image/jpeg';
      const r1 = await callGeminiRaw(base64, mimeType, geminiKey, MARK_READ_PROMPT_TMPL, GEMINI_MODEL_CANDIDATES);
      if (!r1.text) throw new Error('Geminiから結果を取得できませんでした。');
      votes.push(parseAnswerText(r1.text, Array(TOTAL_Q).fill(null)).next);
      if (aiCount >= 2) {
        comboState.progress = `Claudeで照合中…（2/${aiCount}）`; render();
        const r2 = await callClaudeRaw(base64, mimeType, claudeKey, MARK_READ_PROMPT_TMPL, CLAUDE_MODEL_CANDIDATES);
        votes.push(r2.text ? parseAnswerText(r2.text, Array(TOTAL_Q).fill(null)).next : Array(TOTAL_Q).fill(null));
      }
    }
    if (n === 1) {
      setAnswers(votes[0]);
      comboState.disagreements = [];
    } else {
      const { merged, disagreements } = mergeVotes(votes, TOTAL_Q);
      const final = merged.slice();
      for (let i = 0; i < TOTAL_Q; i++) {
        if (final[i] === null) {
          const guess = votes.map(v => v[i]).find(v => v !== null && v !== undefined);
          if (guess !== undefined) final[i] = guess;
        }
      }
      setAnswers(final);
      comboState.disagreements = disagreements;
      if (disagreements.length > 0) {
        comboState.error = `タップとAIの判定が一致しなかった問題（要確認・1つの結果を仮採用）：Q${disagreements.join(', Q')}`;
      }
    }
  } catch (e) {
    comboState.error = (e && e.message) ? e.message : 'AIとの照合に失敗しました。';
  }
  comboState.busy = false; comboState.progress = ''; render();
}

function renderComboReader(cfg){
  const { answers, setAnswers, mergeAnswers, photoState, comboState, groups, dotColor, highlightQs } = cfg;
  if (comboState.aiCount === undefined) comboState.aiCount = 1;
  const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '10px' } });

  wrap.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--inkSoft)', lineHeight: '1.6' } }, '写真を選び、4隅をタップしてください。タップによる機械判定（決定論的）がまず反映されます。そのあと下のボタンでAIとも照合すると、両方が一致した問題だけ確定し、不一致は要確認になります。'));

  wrap.appendChild(renderCornerPhotoReader({
    answers, setAnswers, mergeAnswers, groups, photoState, dotColor, highlightQs,
    onCalibrated: (file, tapVotes) => { comboState.file = file; comboState.tapVotes = tapVotes; comboState.disagreements = []; comboState.error = ''; render(); },
    onReset: () => { comboState.file = null; comboState.tapVotes = null; comboState.disagreements = []; comboState.error = ''; if (cfg.onReset) cfg.onReset(); },
  }));

  if (comboState.tapVotes) {
    const currentKey = getGeminiKey();
    const currentClaudeKey = getClaudeKey();
    const aiPanel = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px', border: '2px solid var(--red)', borderRadius: '9px', padding: '10px' } });
    aiPanel.appendChild(el('div', { style: { fontSize: '12px', fontWeight: '700' } }, 'AIとも照合する（タップ結果と付き合わせて確認）'));

    const row = el('div', { style: { display: 'flex', gap: '4px' } });
    [[0, 'タップのみ'], [1, '+Gemini1回'], [2, '+Gemini+Claude']].forEach(([c, lb]) => {
      row.appendChild(el('button', { class: 'presetbtn' + (comboState.aiCount === c ? ' active' : ''), onclick: () => { comboState.aiCount = c; render(); } }, lb));
    });
    aiPanel.appendChild(row);

    const needsClaude = comboState.aiCount >= 2;
    if (comboState.aiCount >= 1) {
      const keyWrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px' } });
      keyWrap.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--inkSoft)' } }, 'Gemini APIキー（この端末に保存されます）'));
      const keyInput = el('input', { type: 'password', placeholder: 'ここにGemini APIキーを貼り付け' });
      keyInput.value = currentKey;
      keyInput.addEventListener('change', e => { setGeminiKey(e.target.value.trim()); render(); });
      keyWrap.appendChild(keyInput);
      aiPanel.appendChild(keyWrap);
    }
    if (needsClaude) aiPanel.appendChild(renderClaudeKeyInput());

    const ready = comboState.aiCount === 0 || (currentKey && (!needsClaude || currentClaudeKey));
    const btn = el('button', { class: 'btn btn-danger', style: { opacity: (comboState.busy || !ready) ? 0.5 : 1 }, onclick: () => {
      if (comboState.busy || !ready) return;
      runComboRead(comboState, mergeAnswers, currentKey, currentClaudeKey, comboState.aiCount);
    } }, comboState.busy ? `照合中…${comboState.progress || ''}` : (comboState.aiCount === 0 ? 'タップ結果を確定する' : '🔮 AIとも照合する'));
    aiPanel.appendChild(btn);
    if (comboState.aiCount >= 1 && !currentKey) aiPanel.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--red)', fontWeight: '700' } }, '↑ Gemini APIキーが必要です。'));
    else if (needsClaude && !currentClaudeKey) aiPanel.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--red)', fontWeight: '700' } }, '↑ Claude APIキーも必要です。'));
    if (comboState.error) aiPanel.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--red)', lineHeight: '1.6' } }, comboState.error));
    wrap.appendChild(aiPanel);
  }

  return wrap;
}

async function runMultiMarkRead(file, geminiKey, claudeKey, state, setAnswers, mode){
  const n = voteCountOf(mode);
  state.busy = true; state.error = ''; state.disagreements = [];
  state.progress = n > 1 ? `1回目を読み取り中…（1/${n}）` : 'Geminiで読み取り中…';
  render();
  try {
    const base64 = await fileToBase64(file);
    const mimeType = file.type || 'image/jpeg';
    const prompt = MARK_READ_PROMPT_TMPL;

    const votes = [];
    const r1 = await callGeminiRaw(base64, mimeType, geminiKey, prompt, GEMINI_MODEL_CANDIDATES);
    if (!r1.text) throw new Error('Geminiから結果を取得できませんでした。');
    votes.push(parseAnswerText(r1.text, Array(TOTAL_Q).fill(null)).next);

    if (n >= 2) {
      state.progress = `2回目を読み取り中（照合用）…（2/${n}）`; render();
      const r2 = await callGeminiRaw(base64, mimeType, geminiKey, prompt, GEMINI_MODEL_CANDIDATES, r1.model);
      votes.push(r2.text ? parseAnswerText(r2.text, Array(TOTAL_Q).fill(null)).next : Array(TOTAL_Q).fill(null));
    }
    if (n >= 3) {
      state.progress = `3回目を読み取り中（Claude・照合用）…（3/${n}）`; render();
      const r3 = await callClaudeRaw(base64, mimeType, claudeKey, prompt, CLAUDE_MODEL_CANDIDATES);
      votes.push(r3.text ? parseAnswerText(r3.text, Array(TOTAL_Q).fill(null)).next : Array(TOTAL_Q).fill(null));
    }

    if (n === 1) {
      setAnswers(votes[0]);
      state.disagreements = [];
    } else {
      const { merged, disagreements } = mergeVotes(votes, TOTAL_Q);
      // 過半数が一致しなかった問題は、答えを空欄にしてしまうと採点時にその問題
      // （順不同グループの場合はグループ全体）が無条件で不正解扱いになってしまう。
      // それを避けるため、1票でも判定できていればその値を仮採用しつつ
      // disagreements に残して要確認表示は維持する（正誤はじまちゃんの目で確認できる）。
      const final = merged.slice();
      for (let i = 0; i < TOTAL_Q; i++) {
        if (final[i] === null) {
          const guess = votes.map(v => v[i]).find(v => v !== null && v !== undefined);
          if (guess !== undefined) final[i] = guess;
        }
      }
      setAnswers(final);
      state.disagreements = disagreements;
      if (disagreements.length > 0) {
        state.error = `${n}票中、過半数が一致しなかった問題（要確認・1つの読み取り結果を仮採用しています）：Q${disagreements.join(', Q')}`;
      }
    }
  } catch (e) {
    state.error = (e && e.message) ? e.message : '読み取りに失敗しました。';
  }
  state.busy = false; state.progress = ''; render();
}

    state.busy ? `読み取り中…${state.batchProgress ? state.batchProgress + '　' : ''}${state.progress || ''}` : '🔮 写真をAIに読ませる（複数枚まとめて選択可）');
  if (!state.busy && ready) {
    const inp = el('input', { type: 'file', accept: 'image/*', multiple: true, style: { display: 'none' } });
    inp.addEventListener('change', async e => {
      const files = Array.from(e.target.files || []);

      if (files.length === 0) return;
      // 複数枚まとめて選ばれた場合は1枚ずつ順番にAIへ送り、結果は毎回mergeAnswersで積み上げる。
      // 既存の「続きから採点（大問ごとの合算）」の仕組みをそのまま使うので、
      // 別の大問の写真を複数まとめて選んでも自動で合算される。
      for (let i = 0; i < files.length; i++) {
        state.batchProgress = files.length > 1 ? `（${i + 1}/${files.length}枚目）` : '';
        await runMultiMarkRead(files[i], currentKey, currentClaudeKey, state, mergeAnswers, state.mode);
        if (state.error) break; // 途中で失敗したら止めて内容を確認できるようにする（残り枚数分を無駄打ちしない）
      }
      state.batchProgress = '';
      render();
    });
    label.appendChild(inp);
  }
  wrap.appendChild(label);
  if (!currentKey) wrap.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--red)', fontWeight: '700' } }, '↑ まずGemini APIキーを貼り付けてください。'));
  else if (needsClaude && !currentClaudeKey) wrap.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--red)', fontWeight: '700' } }, '↑ 3票照合にはClaude APIキーも必要です。'));
  if (state.error) wrap.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--red)', lineHeight: '1.6' } }, state.error));

  if (answers.length > 0 && answers.some(a => a !== null)) {
    wrap.appendChild(renderAnswerCorrectionList(answers, setAnswers, groups, highlightQs));
  }
  return wrap;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.readAsDataURL(file);
  });
}

// エイリアス（gemini-flash-latest / gemini-pro-latest）はGoogle側で常に
// 最新の安定モデルを指すよう更新されるため最優先。廃止されがちな個別バージョン名は
// 保険として後ろに並べる（2026年9月時点でgemini-3.7-flashが最新の安定Flash）。
const GEMINI_MODEL_CANDIDATES = ['gemini-flash-latest', 'gemini-3.7-flash', 'gemini-3.6-flash', 'gemini-pro-latest', 'gemini-3.1-pro-preview'];
// トリプル照合の3票目（Claude API・じまちゃんのAnthropic APIキーを使用）
const CLAUDE_MODEL_CANDIDATES = ['claude-sonnet-5', 'claude-haiku-4-5-20251001'];

function formatBulkTextForDisplay(text){
  const tokens = text.split(/[,、\n]+/).map(t => t.trim()).filter(Boolean);
  const lines = [];
  for (let i = 0; i < tokens.length; i += 10) lines.push(tokens.slice(i, i + 10).join(', '));
  return lines.join('\n');
}

function extractAndMergeGroups(text, currentGroupsText){
  // AI出力の末尾に「:順」または「:order」が付いていれば順序通りグループ、
  // 付いていなければ（従来通り）順不同グループとして扱う。
  const reGroup = /GROUP\s*:\s*(\d{1,3})\s*[-〜~－]\s*(\d{1,3})(?:\s*:\s*(\d{1,3}))?(?:\s*:\s*(順|order))?/g;
  const found = [];
  let m;
  while ((m = reGroup.exec(text)) !== null) {
    const orderSuffix = m[4] ? '順' : '';
    found.push(m[3] ? `${m[1]}-${m[2]}${orderSuffix}:${m[3]}` : `${m[1]}-${m[2]}${orderSuffix}`);
  }
  const cleanedText = text.replace(reGroup, ' ');
  if (found.length === 0) return { cleanedText, groupsText: currentGroupsText, addedCount: 0 };

  // 重複判定は「順」マーカーを無視した範囲（開始-終了）のみで行う
  const rangeKeyOf = s => { const mm = s.match(/^(\d+)\s*[-〜~－]\s*(\d+)/); return mm ? `${mm[1]}-${mm[2]}` : s.replace(/\s/g, ''); };
  const existing = (currentGroupsText || '').split(/[,、\n]+/).map(s => s.trim()).filter(Boolean);
  const existingRanges = new Set(existing.map(rangeKeyOf));
  const additions = found.filter(f => !existingRanges.has(rangeKeyOf(f)));
  const merged = existing.concat(additions).join(', ');
  return { cleanedText, groupsText: merged, addedCount: additions.length };
}

// 解答表の画像に「大問1」「第2問」のような見出し・区切りがあれば、AIにその範囲も
// 検出させて自動で⑤大問区切りへ反映する（グループのGROUP:行と同じ考え方）。
function extractAndMergeSections(text, currentSectionsText){
  const reSection = /SECTION\s*:\s*([^:：\n,、]{0,20}?)\s*:\s*(\d{1,3})\s*[-〜~－]\s*(\d{1,3})/g;
  const found = [];
  let m;
  while ((m = reSection.exec(text)) !== null) {
    const label = (m[1] || '').trim();
    found.push(`${label ? label + ':' : ''}${m[2]}-${m[3]}`);
  }
  const cleanedText = text.replace(reSection, ' ');
  if (found.length === 0) return { cleanedText, sectionsText: currentSectionsText, addedCount: 0 };

  const existing = (currentSectionsText || '').split(/[,、\n]+/).map(s => s.trim()).filter(Boolean);
  const rangeOf = s => { const parts = s.split(':'); return (parts[parts.length - 1] || '').replace(/\s/g, ''); };
  const existingRanges = new Set(existing.map(rangeOf));
  const additions = found.filter(f => !existingRanges.has(rangeOf(f)));
  const merged = existing.concat(additions).join(', ');
  return { cleanedText, sectionsText: merged, addedCount: additions.length };
}

const ANSWER_TABLE_PROMPT = `この画像は解答一覧表です。「問1」「1.」などの問題番号ラベル、その正解（①②③のような丸数字、または算用数字）、そして配点（その問題の点数、通常は隣接する列に書かれた数字）がセットで並んでいます。並び順が左右2列だったり、番号順どおりでない場合があります。

まず、画像に写っている問題ラベル・正解・配点の組をすべて、順番は気にせず「問題番号:正解:配点」の形式で、カンマ区切りで出力してください（例：1:4:2,2:2:3,15:0:2,...）。正解が丸数字（①②③④⑤⑥⑦⑧⑨、⓪）の場合は対応する算用数字（1,2,3,4,5,6,7,8,9,0）に変換してください。配点が画像に見当たらない問題は「問題番号:正解」の2つだけでも構いません。

次に、複数の解答欄をまとめて「全部正解しないと点が入らない」形で採点する問題の範囲があれば、それは「グループ」です。グループには次の2種類があるので、見分けて区別してください（表の下に「※は、全部正解の場合のみ点を与える」「-（ハイフン）でつながった正解は、順序を問わない」のような凡例が書かれていれば、それがそのままこの2種類の説明です）。

【順不同グループ】＝グループ内の正解がどの解答欄に入っていてもよい（位置の入れ替えOK）
- 正解の欄がハイフンでつながれた複数の丸数字になっている（例：②-⑤、30-31）→ これが順不同グループの典型例です

【順序通りグループ】＝各解答欄にそれぞれ決まった正解があり、その位置のまま全部一致して初めて配点される（位置の入れ替えは不可。ただし全部正解でないと0点というall-or-nothingの点は順不同と同じ）
- 正解の欄はハイフンでつながっておらず、連続する複数の解答欄（例：9,10,11,12）にそれぞれ個別の正解が入っているが、配点欄に※や*などの注釈があり「全部正解の場合のみ点を与える」といった趣旨が書かれている、または配点が複数の問題番号にまたがって1つだけ書かれている（結合セルのように見える）
- 並べ替え問題（文章や語句の順序を答えるタイプ）で、複数の解答欄がそれぞれ1点などの小さい配点で表になっているが、実際にはその並べ替え全体が完成して初めて配点される場合

どちらのグループの場合も、各解答欄の問題番号と正解は必ず個別に「問題番号:正解:配点」として出力してください（配点は表に書かれている数字のままで構いません、後で合計点に上書きされます）。その上で、その範囲をGROUPとして追加し、配点にはそのグループ全体の合計点（表の近くに書かれている合計点、または個別配点の合計など）を指定してください。

そのような範囲を見つけたら、個別の問題出力に加えて、次の形式で追加してください（配点が分からなければ配点部分は省略して構いません）：
- 順不同グループ：「GROUP:開始問題番号-終了問題番号:配点」例：GROUP:30-31:3
- 順序通りグループ：末尾にさらに「:順」を付ける「GROUP:開始問題番号-終了問題番号:配点:順」例：GROUP:9-12:3:順

さらに、画像の中に「大問1」「第1問」「Part1」「大問一」のような、複数の問題をまとめる見出し・区切り線・段組みの切り替わりが見えたら、その大問がどの問題番号からどの問題番号までを含むかを判定し、「SECTION:見出しの名前:開始問題番号-終了問題番号」の形式で追加してください（見出しの文字が読み取れなければ「SECTION::開始-終了」のように名前を省略しても構いません）。例：SECTION:大問1:1-30　見出しが無く、大問の区切りが分からない場合は無理に出力しなくて構いません。

出力は「問題番号:正解:配点」の並びと「GROUP:...」「SECTION:...」の並びだけにしてください。見出し・注釈・説明文は一切含めないでください。自信を持って読み取れないものは出力しなくて構いません。`;

async function runMultiOcr(file, geminiKey, claudeKey, mode){
  const n = voteCountOf(mode);
  NS.ocrBusy = true; NS.ocrError = ''; NS.geminiDisagreements = []; NS.pointsUndetectedFromOcr = [];
  NS.ocrProgress = n > 1 ? `1回目を読み取り中…（1/${n}）` : 'Geminiで読み取り中…';
  render();
  try {
    const base64 = await fileToBase64(file);
    const mimeType = file.type || 'image/jpeg';
    const prompt = ANSWER_TABLE_PROMPT;

    const raws = [];
    const r1 = await callGeminiRaw(base64, mimeType, geminiKey, prompt, GEMINI_MODEL_CANDIDATES);
    if (!r1.text) throw new Error('Geminiから結果を取得できませんでした。');
    raws.push(r1.text);

    if (n >= 2) {
      NS.ocrProgress = `2回目を読み取り中（照合用）…（2/${n}）`; render();
      const r2 = await callGeminiRaw(base64, mimeType, geminiKey, prompt, GEMINI_MODEL_CANDIDATES, r1.model);
      raws.push(r2.text || '');
    }
    if (n >= 3) {
      NS.ocrProgress = `3回目を読み取り中（Claude・照合用）…（3/${n}）`; render();
      const r3 = await callClaudeRaw(base64, mimeType, claudeKey, prompt, CLAUDE_MODEL_CANDIDATES);
      raws.push(r3.text || '');
    }

    // 順不同グループはどの読み取り結果から見つかっても採用する（1票でも検出すれば反映）
    let groupsText = NS.groupsText, addedCount = 0;
    let sectionsText = NS.sectionsText, sectionsAddedCount = 0;
    const cleanedRaws = raws.map(text => {
      const gr = extractAndMergeGroups(text, groupsText);
      groupsText = gr.groupsText; addedCount += gr.addedCount;
      const sr = extractAndMergeSections(gr.cleanedText, sectionsText);
      sectionsText = sr.sectionsText; sectionsAddedCount += sr.addedCount;
      return sr.cleanedText;
    });
    NS.groupsText = groupsText;
    NS.geminiGroupsFound = addedCount;
    NS.sectionsText = sectionsText;
    NS.geminiSectionsFound = sectionsAddedCount;

    let finalRaw;
    if (n === 1) {
      finalRaw = cleanedRaws[0];
      NS.geminiDisagreements = [];
    } else {
      const parsed = cleanedRaws.map(t => parseAnswerText(t, Array(TOTAL_Q).fill(null), Array(TOTAL_Q).fill(0)));
      const { merged, disagreements } = mergeVotes(parsed.map(p => p.next), TOTAL_Q);
      // 配点は正解と違って多数決に馴染まないため、検出した読み取り結果のうち
      // 最初のもの（優先順）の値を採用する。どの読み取り結果にも配点が
      // 見当たらなかった問題は、当て推量で1点などを入れると合計点が
      // 静かにズレてしまうため、0点として扱う（後で見つけやすいように0点にする）。
      const points = Array(TOTAL_Q).fill(0);
      for (let i = 0; i < TOTAL_Q; i++) {
        for (const p of parsed) { if (p.pointsSet && p.pointsSet.has(i + 1)) { points[i] = p.points[i]; break; } }
      }
      // 過半数が一致しなかった問題を丸ごと除外すると、配点まで一緒に消えてしまい
      // （特に順不同グループ・並べ替え問題はグループ内の1問が不一致になっただけで
      // グループ全体の合計点がズレる）合計点表示が信用できなくなる。そのため、
      // 1票でも読み取れていればその答え＋正しい配点を仮採用として残し、
      // disagreements には引き続き載せて「要確認」表示・オレンジ枠は維持する。
      const tokens = [];
      const noPointsDetected = [];
      for (let i = 0; i < TOTAL_Q; i++) {
        let ansIdx = merged[i];
        if (ansIdx === null) {
          const guess = parsed.map(p => p.next[i]).find(v => v !== null && v !== undefined);
          if (guess !== undefined) ansIdx = guess;
        }
        if (ansIdx !== null && ansIdx !== undefined) {
          tokens.push(`${i + 1}:${CHOICE_LABELS[ansIdx]}:${points[i]}`);
          // どの読み取り結果にもこの問題の配点が含まれていなかった場合、上のpointsは
          // 単なるデフォルト値（1点や前回値）でしかない。トークンに埋め込むと後段の
          // 「反映する」側では検出できなくなるため、ここで直接検出しておく。
          if (!parsed.some(p => p.pointsSet && p.pointsSet.has(i + 1))) noPointsDetected.push(i + 1);
        }
      }
      finalRaw = tokens.join(',');
      NS.geminiDisagreements = disagreements;
      NS.pointsUndetectedFromOcr = noPointsDetected;
      if (disagreements.length > 0) {
        NS.ocrError = `${n}票中、過半数が一致しなかった問題（要確認・1つの読み取り結果を仮採用し配点はそのまま反映しています）：Q${disagreements.join(', Q')}`;
      }
    }

    NS.bulkText = formatBulkTextForDisplay(finalRaw.trim());
    if (!NS.bulkText) NS.ocrError = NS.ocrError || '結果を取得できませんでした。';
  } catch (e) {
    NS.ocrError = (e && e.message) ? e.message : '読み取りに失敗しました。';
  }
  NS.ocrBusy = false; NS.ocrProgress = ''; render();
}

async function runOcr(file){
  if (typeof Tesseract === 'undefined') {
    NS.ocrError = 'OCRエンジンを読み込めませんでした。インターネット接続を確認してもう一度お試しください。';
    render();
    return;
  }
  NS.ocrBusy = true; NS.ocrError = ''; NS.ocrProgress = ''; render();
  try {
    const result = await Tesseract.recognize(file, 'eng', {
      logger: m => {
        if (m.status === 'recognizing text') {
          NS.ocrProgress = Math.round((m.progress || 0) * 100) + '%';
          render();
        }
      },
    });
    NS.bulkText = (result.data && result.data.text) ? result.data.text.trim() : '';
    if (!NS.bulkText) NS.ocrError = '文字を検出できませんでした。手動での入力をお試しください。';
  } catch (e) {
    NS.ocrError = '読み取りに失敗しました。もう一度お試しください。';
  }
  NS.ocrBusy = false; NS.ocrProgress = ''; render();
}

  if (parsedSections.length > 0) {
    const { perSection, uncovered } = computeSectionPointTotals(parsedSections, currentGroups, currentPoints);
    const sectionSum = perSection.reduce((s, p) => s + p.total, 0);
    const secBox = el('div', { style: { fontSize: '10.5px', color: 'var(--inkSoft)', lineHeight: '1.8', marginTop: '6px', border: '1px solid var(--line)', borderRadius: '8px', padding: '8px 10px' } });
    secBox.appendChild(el('div', { style: { fontWeight: '700', color: 'var(--ink)' } }, '大問ごとの配点（自動計算・④の配点欄から集計）'));
    perSection.forEach(p => secBox.appendChild(el('div', null, `${p.label}（Q${p.qs[0]+1}〜Q${p.qs[p.qs.length-1]+1}）：${p.total}点`)));
    const matchesTotal = sectionSum === totalPoints;
    secBox.appendChild(el('div', { style: { fontWeight: '700', color: matchesTotal ? 'var(--green)' : 'var(--red)', marginTop: '2px' } },
      `大問の合計：${sectionSum}点${matchesTotal ? '（④の合計と一致）' : `（④の合計 ${totalPoints}点と不一致）`}`));
    if (uncovered.length > 0) {
      secBox.appendChild(el('div', { style: { color: 'var(--red)' } }, `どの大問にも含まれていない問題：Q${uncovered.join(', Q')}`));
    }
    wrap.appendChild(secBox);
  }

  const footer = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', marginTop: '4px' } });
  if (missingCount > 0) {
    footer.appendChild(el('div', { style: { fontSize: '11.5px', color: 'var(--red)', textAlign: 'center' } }, `正解が未入力の問題が${missingCount}問あります。保存はできます（後で編集から追記できます）。`));
  }
  const btnRow = el('div', { style: { display: 'flex', gap: '8px' } });
  btnRow.appendChild(el('button', { class: 'btn btn-secondary', style: { flex: '1' }, onclick: () => { UI.view = 'home'; render(); } }, 'キャンセル'));
  // セット名が空でも保存をブロックしない（「セット名を入力してください」で
  // 詰まる問題が繰り返し起きていたため、空の場合は自動で仮の名前を付けて進める）。
  btnRow.appendChild(el('button', { class: 'btn', style: { flex: '2', background: 'var(--ink)', color: 'var(--paper)', borderRadius: '10px', padding: '12px 0', fontWeight: '700', fontSize: '13.5px' }, onclick: () => {
    const nameTrim = NS.name.trim() || `無題のセット（${new Date().toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}）`;
    const s = { id: NS.id || uid(), name: nameTrim, answerKey: NS.answerKey, groups: parseGroupsText(NS.groupsText), points: parsePointsText(NS.pointsText, TOTAL_Q), sections: parseSectionsText(NS.sectionsText), createdAt: NS.createdAt || Date.now() };
    DB.sets = NS.id ? DB.sets.map(x => x.id === NS.id ? s : x) : [...DB.sets, s];
    saveSets();
    UI.view = 'home'; render();
  } }, NS.id ? '更新を保存' : 'セットを保存'));
  footer.appendChild(btnRow);
  wrap.appendChild(footer);

  return wrap;
}

function ensureGR(){
  if (!GR) GR = {
    setId: DB.sets[0] ? DB.sets[0].id : null, studentName: '', answers: [], graded: null,
    readMode: 'corner',
    photo: { img: null, w: 0, h: 0, corners: [], loadError: '' },
    comboPhoto: { img: null, w: 0, h: 0, corners: [], loadError: '' },
    comboState: { busy: false, error: '', progress: '', tapVotes: null, file: null, aiCount: 1, disagreements: [] },
    geminiState: { busy: false, error: '', progress: '' },
    draftDecided: null, // 'continue' | 'fresh' | null（現在のセット＋生徒名の組み合わせについて判断済みか）
    targetSections: [], // 空配列 = 全体を採点、数値の配列 = その大問（複数可）だけを対象に読み取る
    lockedSections: [], // 「確定」した大問（このセット・この生徒の下書きに保存される）
    overwriteLocked: false, // ロック済みの大問を今回の読み取りで上書きしてよいか
    rawLastDetection: null, // 直近の「4隅タップ」で得られた読み取り結果（大問の絞り込み前・全55問分）。
                            // 対象の大問を変えるだけで、この結果を再適用できるようにするためのキャッシュ。
  };
}
function renderGrade(){
  if (DB.sets.length === 0) return el('div', { class: 'empty' }, '採点するにはまず正解セットを登録してください（ホーム画面の「新しい正解セットを登録」）。');

  });
  sel.addEventListener('change', e => {
    GR.setId = e.target.value; GR.answers = []; GR.graded = null; GR.draftDecided = null; GR.targetSections = []; GR.lockedSections = []; GR.overwriteLocked = false; GR.rawLastDetection = null;
    GR.photo = { img: null, w: 0, h: 0, corners: [], loadError: '' };
    GR.comboPhoto = { img: null, w: 0, h: 0, corners: [], loadError: '' };
    GR.comboState = { busy: false, error: '', progress: '', tapVotes: null, file: null, aiCount: 1, disagreements: [] };

  wrap.appendChild(stepHeader(2, '生徒の名前を入力'));
  const nameInput = el('input', { type: 'text', placeholder: '例：山田太郎', list: 'msg-names' });

  nameInput.addEventListener('input', e => { GR.studentName = e.target.value; });
  nameInput.addEventListener('change', e => {
    GR.studentName = e.target.value;

    // 作業中のデータを一旦リセットする（続きから採点したい場合は、この後に出る
