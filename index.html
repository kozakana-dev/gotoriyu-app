    GR.answers = []; GR.graded = null;
    GR.draftDecided = null; GR.lockedSections = []; GR.targetSections = []; GR.overwriteLocked = false; GR.rawLastDetection = null;
    GR.photo = { img: null, w: 0, h: 0, corners: [], loadError: '' };
    GR.comboPhoto = { img: null, w: 0, h: 0, corners: [], loadError: '' };
    GR.geminiState = { busy: false, error: '', progress: '' };
    render();
  });
  wrap.appendChild(nameInput);
  const dl = el('datalist', { id: 'msg-names' });
  uniqueNames().forEach(n => dl.appendChild(el('option', { value: n })));
  wrap.appendChild(dl);

  const trimmedName = GR.studentName.trim();
  const existingDraft = trimmedName ? findDraft(GR.setId, trimmedName) : null;
  if (existingDraft && GR.draftDecided === null) {
    const answeredCount = existingDraft.answers.filter(a => a !== null && a !== undefined).length;
    const box = el('div', { class: 'notice-blue' });
    box.appendChild(document.createTextNode(`「${trimmedName}」さんは、このセットで前回までの途中経過があります（${answeredCount}/${TOTAL_Q}問まで採点済み）。`));
    const btnRow2 = el('div', { style: { display: 'flex', gap: '8px', marginTop: '8px' } });
    btnRow2.appendChild(el('button', { class: 'btn btn-secondary', style: { flex: '1' }, onclick: () => {
      GR.answers = existingDraft.answers.slice(); GR.lockedSections = (existingDraft.lockedSections || []).slice(); GR.graded = null; GR.draftDecided = 'continue'; render();
    } }, '続きから採点する'));
    btnRow2.appendChild(el('button', { class: 'btn btn-secondary', style: { flex: '1' }, onclick: () => {
      GR.draftDecided = 'fresh'; render();
    } }, '最初からやり直す'));
    box.appendChild(btnRow2);
    wrap.appendChild(box);
  }

  wrap.appendChild(stepHeader(3, '解答用紙を読み取る', 'AIで読み取るか、4隅の黒いマークをタップする方式か、その両方を組み合わせて照合するかを選べます。前回までの途中経過を読み込んでいる場合、今回新しく判定できた問題だけが追加され、以前の分は保持されます。'));

  const sections = set.sections || [];
  if (sections.length > 0) {
    const secWrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '6px', marginBottom: '10px' } });
    secWrap.appendChild(el('div', { style: { fontSize: '11px', fontWeight: '700', color: 'var(--inkSoft)' } }, '採点する範囲（大問・複数選択可）'));
    const pillRow = el('div', { style: { display: 'flex', gap: '4px', flexWrap: 'wrap' } });
    pillRow.appendChild(el('button', { class: 'presetbtn' + (GR.targetSections.length === 0 ? ' active' : ''), onclick: () => { GR.targetSections = []; reapplyIfCached(); } }, '全体'));
    sections.forEach((sec, si) => {
      const active = GR.targetSections.indexOf(si) !== -1;
      const locked = GR.lockedSections.indexOf(si) !== -1;
      pillRow.appendChild(el('button', { class: 'presetbtn' + (active ? ' active' : ''), style: locked ? { borderColor: 'var(--green)' } : null, onclick: () => {
        GR.targetSections = active ? GR.targetSections.filter(x => x !== si) : GR.targetSections.concat([si]);
        reapplyIfCached();
      } }, (locked ? '🔒 ' : '') + sec.label));
    });
    secWrap.appendChild(pillRow);
    if (GR.targetSections.length > 0) {
      const chosenLabel = GR.targetSections.map(si => sections[si].label).join('・');
      secWrap.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--inkSoft)' } }, `今回読み取った結果のうち、${chosenLabel}以外の問題は反映されません（他の大問を別のタイミングで採点しても、続きから採点の仕組みで自動的に合算されます）。`));
    }
    // ライブ進捗：これまでにどの大問がどこまで採点済みか（下書き含む現在のGR.answersを基準に表示）
    if (GR.answers.length === TOTAL_Q) {
      const subtotals = computeSectionSubtotals(set, GR.answers);
      const progWrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '2px', fontSize: '10.5px', color: 'var(--inkSoft)', marginTop: '4px' } });
      let anyMissingKeyInSelected = false;
      sections.forEach((sec, si) => {
        const answeredCount = sec.qs.filter(qi => GR.answers[qi] !== null && GR.answers[qi] !== undefined).length;
        const sub = subtotals[si];
        const done = answeredCount === sec.qs.length;
        const perfect = done && sub.total > 0 && sub.score === sub.total; // 読み取り完了 かつ 満点の時だけ「正解」扱い
        const locked = GR.lockedSections.indexOf(si) !== -1;
        const missingKeyCount = sec.qs.filter(qi => set.answerKey[qi] === null).length;
        if (missingKeyCount > 0 && GR.targetSections.indexOf(si) !== -1) anyMissingKeyInSelected = true;
        // 記号：✓(緑)=読み取り完了かつ満点／△(オレンジ)=読み取り完了だが誤答あり／・(灰)=未完了
        const mark = locked ? '🔒' : !done ? '・' : (perfect ? '✓' : '△');
        const markColor = !done ? 'var(--inkSoft)' : (perfect ? 'var(--green)' : '#C98A00');
        progWrap.appendChild(el('div', { style: { color: markColor } },
          `${mark} ${sec.label}：${answeredCount}/${sec.qs.length}問${done ? `（現在 ${sub.score}/${sub.total}点）` : ''}${locked ? '（確定済み）' : ''}${missingKeyCount > 0 ? `　※${missingKeyCount}問は正解が未登録（採点対象外）` : ''}`));
      });
      secWrap.appendChild(progWrap);
      if (anyMissingKeyInSelected) {
        secWrap.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--red)', fontWeight: '700', marginTop: '2px' } },
          '⚠ 選択中の大問には正解が未登録の問題が含まれています。マーク（赤丸）は正しく読み取れていても、正解が登録されるまではその問題は採点対象になりません。①の正解セット編集で登録してください。'));
      }
    }
    // 大問の確定（ロック）：一区切りついた大問を「確定」しておくと、以後の読み取りで
    // うっかり上書きされなくなる（続きから採点する下書きにも保存される）。
    if (GR.targetSections.length > 0) {
      const lockRow = el('div', { style: { display: 'flex', gap: '6px', marginTop: '4px', flexWrap: 'wrap' } });
      const allLocked = GR.targetSections.every(si => GR.lockedSections.indexOf(si) !== -1);
      lockRow.appendChild(el('button', { class: 'btn btn-secondary', style: { fontSize: '11px', padding: '5px 10px' }, onclick: () => {
        if (allLocked) GR.targetSections.forEach(si => { GR.lockedSections = GR.lockedSections.filter(x => x !== si); });
        else GR.targetSections.forEach(si => { if (GR.lockedSections.indexOf(si) === -1) GR.lockedSections = GR.lockedSections.concat([si]); });
        render();
      } }, allLocked ? '🔓 選択中の大問のロックを解除' : '🔒 選択中の大問を確定してロック'));
      lockRow.appendChild(el('div', { style: { fontSize: '10px', color: 'var(--inkSoft)', alignSelf: 'center' } }, 'ロックした大問は、うっかり別の読み取りで上書きされなくなります'));
      secWrap.appendChild(lockRow);
    }
    if (GR.lockedSections.length > 0) {
      const owRow = el('label', { style: { display: 'flex', alignItems: 'center', gap: '6px', fontSize: '10.5px', color: 'var(--inkSoft)', cursor: 'pointer', marginTop: '2px' } });
      const owCheckbox = el('input', { type: 'checkbox' });
      owCheckbox.checked = GR.overwriteLocked;
      owCheckbox.addEventListener('change', e => { GR.overwriteLocked = e.target.checked; render(); });
      owRow.appendChild(owCheckbox);
      owRow.appendChild(document.createTextNode('ロック済みの大問も、今回の読み取りで上書きする（訂正したい時だけチェック）'));
      secWrap.appendChild(owRow);
    }
    wrap.appendChild(secWrap);
  }

  const modeWrap = el('div', { style: { display: 'flex', gap: '6px', marginBottom: '10px' } });
  [['gemini', '🤖', 'AIで読み取る'], ['corner', '📷', 'タップのみ'], ['combo', '🤖+📷', 'タップ+AI照合（最高精度）']].forEach(([m, ic, lb]) => {
    const b = el('button', { class: 'modebtn' + (GR.readMode === m ? ' active' : ''), onclick: () => { GR.readMode = m; render(); } });
    b.appendChild(el('div', { style: { fontSize: '15px' } }, ic));
    b.appendChild(el('div', null, lb));
    modeWrap.appendChild(b);
  });
  wrap.appendChild(modeWrap);

  const overwriteAnswers = a => { GR.answers = a; GR.graded = null; render(); };
  // scoping は常に「呼ばれた瞬間」の GR.targetSections / GR.lockedSections / GR.overwriteLocked を
  // 見て計算する（render時点のスナップショットにしてしまうと、大問選択を変えた直後に
  // reapplyIfCached() から呼んだ時に古い選択のままになってしまうため）。
  function computeTargetQsSet(){
    if (GR.targetSections.length === 0) return null;
    const s = new Set();
    GR.targetSections.forEach(si => { if (sections[si]) sections[si].qs.forEach(qi => s.add(qi)); });
    return s;
  }
  function computeLockedQsSet(){
    if (GR.overwriteLocked || GR.lockedSections.length === 0) return null;
    const s = new Set();
    GR.lockedSections.forEach(si => { if (sections[si]) sections[si].qs.forEach(qi => s.add(qi)); });
    return s;
  }
  // 大問を選んでいる間は、写真上の赤丸（判定結果の表示）もその大問の問題だけに
  // 切り替える。選択が「全体」なら null にして全問表示に戻す。
  const highlightQsForTargetSections = computeTargetQsSet();
  const mergeAnswers = incoming => {
    GR.rawLastDetection = incoming; // 大問を切り替えるだけで再適用できるようキャッシュしておく
    const targetQsSet = computeTargetQsSet();
    const lockedQsSet = computeLockedQsSet();
    let scoped = targetQsSet ? incoming.map((v, i) => targetQsSet.has(i) ? v : null) : incoming;
    if (lockedQsSet) scoped = scoped.map((v, i) => lockedQsSet.has(i) ? null : v);
    GR.answers = mergeDetectedAnswers(GR.answers, scoped); GR.graded = null; render();
  };
  // 大問（採点する範囲）の選択を変えた時、直前に撮った写真の読み取り結果が既にあれば、
  // 4隅を撮り直さなくてもその結果を今選んでいる大問に自動で再適用する。これが無いと、
  // 「タップした後で範囲だけ変えても反映されない」という状態になってしまう。
  const reapplyIfCached = () => { if (GR.rawLastDetection) mergeAnswers(GR.rawLastDetection); else render(); };

  if (GR.readMode === 'gemini') {
    wrap.appendChild(renderGeminiMarkReader({
      answers: GR.answers, setAnswers: overwriteAnswers, mergeAnswers,
      state: GR.geminiState, groups: set.groups || [],
      highlightQs: highlightQsForTargetSections,
    }));
  } else if (GR.readMode === 'combo') {
    wrap.appendChild(renderComboReader({
      answers: GR.answers, setAnswers: overwriteAnswers, mergeAnswers,
      photoState: GR.comboPhoto, comboState: GR.comboState, dotColor: '#D8362B', groups: set.groups || [],
      highlightQs: highlightQsForTargetSections,
      onReset: () => { GR.rawLastDetection = null; },
    }));
  } else {
    wrap.appendChild(renderCornerPhotoReader({
      answers: GR.answers, setAnswers: overwriteAnswers, mergeAnswers,
      photoState: GR.photo, dotColor: '#D8362B', groups: set.groups || [],
      highlightQs: highlightQsForTargetSections,
      onReset: () => { GR.rawLastDetection = null; },
    }));
  }

  if (GR.answers.length > 0 && !GR.graded) {
    const actionRow = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } });
    actionRow.appendChild(el('button', { class: 'btn btn-danger', onclick: () => { GR.graded = scoreSet(set, GR.answers); render(); } }, '採点する'));
    const answeredSoFar = GR.answers.filter(a => a !== null && a !== undefined).length;
    if (answeredSoFar > 0 && answeredSoFar < TOTAL_Q) {
      const canDraftSave = !!trimmedName;
      actionRow.appendChild(el('button', { class: 'btn btn-secondary', style: { opacity: canDraftSave ? 1 : 0.5 }, onclick: () => {
        if (!canDraftSave) { alert('続きから採点できるようにするには、先に生徒名を入力してください。'); return; }
        upsertDraft(GR.setId, trimmedName, GR.answers, GR.lockedSections);
        alert(`ここまでの${answeredSoFar}/${TOTAL_Q}問を保存しました。同じ生徒名・セットを選ぶと続きから採点できます。`);
        GR.studentName = ''; GR.answers = []; GR.draftDecided = null; GR.lockedSections = []; GR.targetSections = []; GR.overwriteLocked = false; GR.rawLastDetection = null;
        GR.photo = { img: null, w: 0, h: 0, corners: [], loadError: '' };
        GR.geminiState = { busy: false, error: '', progress: '' };
        render();
      } }, `🕗 ここまで（${answeredSoFar}/${TOTAL_Q}問）を保存して後で続きから採点`));
    }
    wrap.appendChild(actionRow);
  }
  if (GR.graded) {
    const headerRow = el('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px' } });
    headerRow.appendChild(stepHeader(4, '結果を確認して保存'));
    headerRow.appendChild(el('button', { class: 'btn btn-secondary', style: { fontSize: '11px', padding: '6px 10px', whiteSpace: 'nowrap' }, onclick: () => {
      GR.graded = scoreSet(set, GR.answers); render();
    } }, '🔄 採点し直す'));
    wrap.appendChild(headerRow);
    wrap.appendChild(renderGradedResult(GR.graded, set));
  }
  return wrap;
}
function renderFlagsGrid(flags, earnedPoints){
  const grid = el('div', { class: 'flags-grid', style: { width: '100%', alignSelf: 'stretch' } });
  flags.forEach((f, i) => {
    const cell = el('div', { class: 'flags-cell ' + f });
    cell.appendChild(el('div', { class: 'fc-q' }, `${i + 1}`));
    cell.appendChild(el('div', { class: 'fc-sym' }, f === 'ok' ? '✓' : f === 'ng' ? '✕' : '―'));
    if (earnedPoints && f !== 'skip') cell.appendChild(el('div', { style: { fontSize: '7.5px', color: 'var(--inkFaint)', fontFamily: 'ui-monospace,monospace' } }, `${earnedPoints[i]}pt`));
    grid.appendChild(cell);
  });
  return grid;
}

function renderGradedResult(graded, set){
  const pct = graded.total > 0 ? Math.round((graded.score / graded.total) * 100) : 0;
  const box = el('div', { class: 'card', style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '10px', padding: '18px 14px' } });
  const scoreWrap = el('div', { style: { textAlign: 'center', fontFamily: 'ui-monospace,monospace' } });
  const big = el('div', { style: { fontSize: '26px', fontWeight: '700' } }, `${graded.score}`);
  big.appendChild(el('span', { style: { fontSize: '14px', color: 'var(--inkSoft)' } }, `/${graded.total}`));
  scoreWrap.appendChild(big);
  scoreWrap.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--inkSoft)', marginTop: '2px' } }, `${pct}点`));
  box.appendChild(scoreWrap);

  box.appendChild(renderFlagsGrid(graded.flags, computeEarnedPossible(set, GR.answers).earned));
  if (graded.flags.some(f => f === 'skip')) box.appendChild(el('div', { style: { fontSize: '11px', color: 'var(--inkSoft)' } }, 'グレー（―）は正解が未登録の問題で、採点対象外です。'));

  const subtotals = computeSectionSubtotals(set, GR.answers);
  if (subtotals.length > 0) {
    const subWrap = el('div', { class: 'subtotal-box' });
    subWrap.appendChild(el('div', { style: { fontSize: '11px', fontWeight: '700', color: 'var(--inkSoft)', marginBottom: '4px' } }, '大問別の得点'));
    subtotals.forEach(st => {
      const row = el('div', { class: 'subtotal-row' });
      row.appendChild(el('div', { style: { fontSize: '12px', fontWeight: '600' } }, st.label));
      row.appendChild(el('div', { style: { fontSize: '12px', fontFamily: 'ui-monospace,monospace', fontWeight: '700' } }, `${st.score} / ${st.total}`));
      subWrap.appendChild(row);
    });
    box.appendChild(subWrap);
  }

  const canSave = !!GR.studentName.trim();
  box.appendChild(el('button', { class: 'btn', style: { width: '100%', background: canSave ? 'var(--ink)' : 'var(--inkFaint)', color: 'var(--paper)', borderRadius: '10px', padding: '12px 0', fontWeight: '700', fontSize: '13.5px' }, onclick: () => {
    if (!canSave) return;
    const nameTrim = GR.studentName.trim();
    DB.records = [{ id: uid(), setId: set.id, setName: set.name, studentName: nameTrim, date: Date.now(), score: graded.score, total: graded.total, answers: GR.answers, answerKey: set.answerKey, flags: graded.flags, points: set.points, groups: set.groups, sections: set.sections }, ...DB.records];
    saveRecords();
    deleteDraft(set.id, nameTrim); // 続き採点用の下書きがあれば、確定保存と同時に消しておく
    GR.answers = []; GR.graded = null; GR.studentName = ''; GR.draftDecided = null; GR.lockedSections = []; GR.targetSections = []; GR.overwriteLocked = false; GR.rawLastDetection = null; GR.photo = { img: null, w: 0, h: 0, corners: [], loadError: '' };
    render();
  } }, canSave ? '💾 この結果を保存' : '①で生徒名を入力してください'));
  return box;
}

// ============================================================
// HISTORY
// ============================================================
function renderHistory(){
  if (DB.records.length === 0) return el('div', { class: 'empty' }, '採点記録はまだありません。「採点する」から読み取ると、ここに生徒ごとに記録されます。');
  const byName = {};
  DB.records.forEach(r => { (byName[r.studentName] = byName[r.studentName] || []).push(r); });

  // 生徒ごとの平均得点率（並べ替え用）
  const avgPctOf = name => {
    const recs = byName[name];
    const pcts = recs.map(r => r.total > 0 ? r.score / r.total : 0);
    return pcts.reduce((a, b) => a + b, 0) / pcts.length;
  };
  let names = Object.keys(byName);
  if (HISTORY_SORT.mode === 'name') names.sort((a, b) => a.localeCompare(b, 'ja'));
  else if (HISTORY_SORT.mode === 'score_desc') names.sort((a, b) => avgPctOf(b) - avgPctOf(a));
  else if (HISTORY_SORT.mode === 'score_asc') names.sort((a, b) => avgPctOf(a) - avgPctOf(b));
  else names.sort((a, b) => Math.max(...byName[b].map(r => r.date)) - Math.max(...byName[a].map(r => r.date)));

  const wrap = el('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } });

  // 全体の簡単な集計（人数・平均点）
  const allPct = Object.keys(byName).map(n => avgPctOf(n) * 100);
  const overallAvg = allPct.length ? Math.round(allPct.reduce((a, b) => a + b, 0) / allPct.length) : 0;
  const statRow = el('div', { style: { display: 'flex', gap: '8px', marginBottom: '2px' } });
  statRow.appendChild(el('div', { class: 'stat' }, [el('div', { class: 'v' }, `${Object.keys(byName).length}`), el('div', { class: 'l' }, '生徒数')]));
  statRow.appendChild(el('div', { class: 'stat' }, [el('div', { class: 'v' }, `${DB.records.length}`), el('div', { class: 'l' }, '採点件数')]));
  statRow.appendChild(el('div', { class: 'stat' }, [el('div', { class: 'v' }, `${overallAvg}`), el('div', { class: 'l' }, '平均点(%)')]));
  wrap.appendChild(statRow);

  const sortRow = el('div', { style: { display: 'flex', gap: '4px', flexWrap: 'wrap' } });
  [['recent', '更新順'], ['name', '名前順'], ['score_desc', '平均点が高い順'], ['score_asc', '平均点が低い順']].forEach(([m, lb]) => {
    sortRow.appendChild(el('button', { class: 'presetbtn' + (HISTORY_SORT.mode === m ? ' active' : ''), onclick: () => { HISTORY_SORT.mode = m; render(); } }, lb));
  });
  wrap.appendChild(sortRow);

  names.forEach(name => {
    const recs = byName[name].sort((a, b) => b.date - a.date);
    const open = HISTORY_OPEN.name === name;
    const pcts = recs.map(r => r.total > 0 ? Math.round((r.score / r.total) * 100) : 0);
    const bestPct = Math.max(...pcts);
    const worstPct = Math.min(...pcts);
    const uniqueSets = new Set(recs.map(r => r.setName)).size;
    const latestDate = new Date(recs[0].date).toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' });
    const cardWrap = el('div', { class: 'card', style: { padding: '0', overflow: 'hidden' } });
    const head = el('button', { class: 'btn', style: { width: '100%', background: 'none', padding: '11px 13px', display: 'flex', alignItems: 'center', gap: '9px' }, onclick: () => { HISTORY_OPEN.name = open ? null : name; render(); } });
    head.appendChild(el('div', null, '👤'));
    const infoCol = el('div', { style: { flex: '1', textAlign: 'left' } });
    infoCol.appendChild(el('div', { style: { fontWeight: '700', fontSize: '13.5px' } }, name));
    const sub = el('div', { style: { fontSize: '10px', color: 'var(--inkSoft)', marginTop: '1px', display: 'flex', gap: '6px', flexWrap: 'wrap' } });
    sub.appendChild(el('span', null, `${recs.length}件`));
    sub.appendChild(el('span', null, `平均${Math.round(avgPctOf(name) * 100)}%`));
    if (recs.length > 1) sub.appendChild(el('span', null, `最高${bestPct}%・最低${worstPct}%`));
    if (uniqueSets > 1) sub.appendChild(el('span', null, `${uniqueSets}種のセット`));
    sub.appendChild(el('span', null, `最終${latestDate}`));
    infoCol.appendChild(sub);
    head.appendChild(infoCol);
    head.appendChild(el('div', null, open ? '▾' : '▸'));
    cardWrap.appendChild(head);
    if (open) {
      const listWrap = el('div', { style: { borderTop: '1px solid var(--line)' } });
      recs.forEach(r => {
        const isOpen = HISTORY_OPEN.recId === r.id;
        const rowWrap = el('div', { style: { borderBottom: '1px solid var(--paperDeep)' } });
        const rowHead = el('div', { style: { display: 'flex', alignItems: 'center', gap: '8px', padding: '9px 13px' } });
        const btn = el('button', { class: 'btn', style: { flex: '1', textAlign: 'left', background: 'none', padding: '0' }, onclick: () => { HISTORY_OPEN.recId = isOpen ? null : r.id; render(); } });
        btn.appendChild(el('div', { style: { fontSize: '12.5px', fontWeight: '600' } }, r.setName));
        btn.appendChild(el('div', { style: { fontSize: '10.5px', color: 'var(--inkSoft)' } }, new Date(r.date).toLocaleDateString('ja-JP')));
        rowHead.appendChild(btn);
        rowHead.appendChild(el('div', { style: { fontFamily: 'ui-monospace,monospace', fontSize: '12.5px', fontWeight: '700', color: r.score === r.total ? 'var(--green)' : 'var(--ink)' } }, `${r.score}/${r.total}`));
        rowHead.appendChild(el('button', { class: 'iconbtn', onclick: () => { DB.records = DB.records.filter(x => x.id !== r.id); saveRecords(); render(); } }, '🗑'));
        rowWrap.appendChild(rowHead);
        if (isOpen) {
          const flags = r.flags || r.answerKey.map((correct, i) => correct === null ? 'skip' : (r.answers[i] === correct ? 'ok' : 'ng'));
          const { earned, possible } = computeEarnedPossible({ answerKey: r.answerKey, points: r.points || Array(TOTAL_Q).fill(0), groups: r.groups || [] }, r.answers);
          const detail = el('div', { style: { padding: '0 13px 11px' } });
          detail.appendChild(renderFlagsGrid(flags, earned));
          rowWrap.appendChild(detail);
          if (r.sections && r.sections.length > 0) {
            const subWrap = el('div', { class: 'subtotal-box', style: { margin: '0 13px 11px' } });
            r.sections.forEach(sec => {
              const score = sec.qs.reduce((s, qi) => s + earned[qi], 0);
              const total = sec.qs.reduce((s, qi) => s + possible[qi], 0);
              const row = el('div', { class: 'subtotal-row' });
              row.appendChild(el('div', { style: { fontSize: '11.5px', fontWeight: '600' } }, sec.label));
              row.appendChild(el('div', { style: { fontSize: '11.5px', fontFamily: 'ui-monospace,monospace', fontWeight: '700' } }, `${score} / ${total}`));
              subWrap.appendChild(row);
            });
            rowWrap.appendChild(subWrap);
          }
        }
        listWrap.appendChild(rowWrap);
      });
      cardWrap.appendChild(listWrap);
    }
    wrap.appendChild(cardWrap);
  });
  return wrap;
}

// ============================================================
// BOOT
// ============================================================
loadDB();
render();

</script>
